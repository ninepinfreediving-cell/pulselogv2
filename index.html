<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Log</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f9d6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pulse Log">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#6b7380;--ac:#0f9d6b;--acx:#fff;--bd:#e3e6eb;--dg:#d64545;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mu:#8b94a3;--ac:#2fd49a;--acx:#06281c;--bd:#272d37;--dg:#ff7070}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mu:#8b94a3;--ac:#2fd49a;--acx:#06281c;--bd:#272d37;--dg:#ff7070}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:9px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:var(--acx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:99px;font:inherit}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:12px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.row{display:flex;gap:8px;align-items:end;margin-bottom:8px}
.row>*{flex:1}
.btn{border:0;background:var(--ac);color:var(--acx);padding:12px;border-radius:12px;font:inherit;font-weight:700;width:100%}
.btn.g{background:none;color:var(--ac);border:1px solid var(--bd);padding:8px;font-weight:600}
.x{background:none;border:0;color:var(--dg);font:inherit;padding:4px 8px;flex:0}
.mu{color:var(--mu);font-size:13px}
.big{font-size:20px;font-weight:700}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s{text-align:center}
#rest{position:sticky;top:env(safe-area-inset-top,0px);z-index:11}#rest:not(:empty){margin-bottom:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.rb{display:flex;align-items:center;gap:8px;background:var(--ac);color:var(--acx);border-radius:14px;padding:8px 12px}
.rb b{font-size:24px;flex:1;font-variant-numeric:tabular-nums}
.rb button{border:0;background:rgba(0,0,0,.18);color:inherit;border-radius:9px;padding:8px 10px;font:inherit;font-weight:600}
.ck{border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:10px;padding:9px 0;font:inherit}
.ck.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.day{position:relative;border:0;background:var(--bg);color:var(--tx);border-radius:10px;padding:10px 0;font:inherit}.day.has i{position:absolute;left:50%;bottom:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ac)}.day.sel{outline:2px solid var(--ac)}
.cl{fill:none;stroke:var(--ac);stroke-width:2}.ca{fill:var(--ac)}.cm{fill:var(--mu);font-size:10px}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}
</style></head><body><main>
<h1>Pulse Log <span><button class="chip" id="u" onclick="tu()"></button> <button class="chip" id="w" onclick="tw()"></button></span></h1>
<div id="rest"></div><div class="tabs" id="tabs"></div>
<div id="v"></div>
</main>
<script>
const K=1.609344,TYPES=['Strength','Run','Cycle','Walk','Swim','Row'],
EX=['Bench press','Squat','Deadlift','Overhead press','Barbell row','Pull-up','Lat pulldown','Leg press','Bicep curl','Tricep pushdown'];
let S={tab:'Log',type:'Strength',unit:'km',draft:[],data:[],rest:{dur:90,end:0},wu:'kg',bw:[],cd:{},edit:null,date:'',cal:{y:0,m:0},cday:'',cx:''};
try{S.data=JSON.parse(localStorage.getItem('pl_data')||'[]');S.unit=localStorage.getItem('pl_unit')||'km'}catch(e){}
const save=()=>{try{localStorage.setItem('pl_data',JSON.stringify(S.data));localStorage.setItem('pl_unit',S.unit);localStorage.setItem('pl_wu',S.wu);localStorage.setItem('pl_bw',JSON.stringify(S.bw))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const fd=d=>new Date(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const dist=km=>(S.unit==='km'?km:km/K).toFixed(2)+' '+S.unit;
const tm=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(c).padStart(2,'0')};
const vol=w=>(w.ex||[]).reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0);
function tu(){S.unit=S.unit==='km'?'mi':'km';save();draw()}
function tab(t){S.tab=t;draw()}
function setType(t){S.type=t;draw()}
function draw(){
 $('#u').textContent=S.unit;$('#w').textContent=S.wu;
 $('#tabs').innerHTML=['Log','History','Calendar','Progress'].map(t=>`<button class="${S.tab===t?'on':''}" onclick="tab('${t}')">${t}</button>`).join('');
 $('#v').innerHTML=S.tab==='Log'?logV():S.tab==='History'?histV():S.tab==='Calendar'?calV():statV();
}
function logV(){
 let h=(S.edit?'<div class="card row" style="align-items:center"><span>Editing a past workout</span><button class="x" onclick="cancelEdit()">Cancel</button></div>':'')+'<label>Workout type</label><select onchange="setType(this.value)">'+TYPES.map(t=>`<option ${S.type===t?'selected':''}>${t}</option>`).join('')+'</select><label>Date</label><input type="date" value="'+S.date+'" onchange="S.date=this.value||ymd(Date.now())" style="margin-bottom:12px">';
 if(S.type==='Strength'){
  h+='<div class="grid"><div>'+tplV2()+'</div><div>'+restPick()+'</div></div>';h+=S.draft.map((e,i)=>`<div class="card"><div class="row" style="margin:0 0 8px"><b>${esc(e.name)}</b><button class="x" onclick="S.swap=S.swap===${i}?-1:${i};draw()">Swap</button><button class="x" onclick="S.draft.splice(${i},1);S.swap=-1;draw()">Remove</button></div>${S.swap===i?swapV(i):''}`+
   e.sets.map((s,j)=>`<div class="set"><span class="mu">${j+1}</span><input type="number" inputmode="decimal" placeholder="${S.wu}" value="${dw(s.w)}" oninput="S.draft[${i}].sets[${j}].w=tk(this.value)"><input type="number" inputmode="numeric" placeholder="reps" value="${s.r}" oninput="S.draft[${i}].sets[${j}].r=this.value"><button class="ck ${s.d?'on':''}" onclick="doneSet(${i},${j})">✓</button></div>`).join('')+
   `<button class="btn g" onclick="addSet(${i})">+ Add set</button></div>`).join('');
  h+=`<div class="card"><label>Add exercise</label><div class="row"><input id="exn" list="exl" placeholder="e.g. Bench press"><button class="btn" style="flex:0 0 auto;width:auto;padding:10px 16px" onclick="addEx()">Add</button></div><datalist id="exl">${EX.map(x=>`<option value="${x}">`).join('')}</datalist></div>`;
  h+=`<button class="btn" onclick="saveStr()">Finish workout</button>`;
 }else{
  h+=`<div class="card"><div class="row"><div><label>Distance (${S.unit})</label><input id="d" type="number" inputmode="decimal" step="0.01" value="${S.cd.d||''}"></div></div>
  <label>Duration</label><div class="row"><input id="hh" type="number" inputmode="numeric" placeholder="h" value="${S.cd.h||''}"><input id="mm" type="number" inputmode="numeric" placeholder="min" value="${S.cd.m||''}"><input id="ss" type="number" inputmode="numeric" placeholder="sec" value="${S.cd.s||''}"></div>
  <label>Notes</label><input id="nt" placeholder="Route, how it felt..." value="${esc(S.cd.nt||'')}"></div><button class="btn" onclick="saveCar()">Save ${S.type.toLowerCase()}</button>`;
 }
 return h;
}
const TPL={'Push':['Bench press','Overhead press','Incline dumbbell press','Lateral raise','Tricep pushdown'],'Pull':['Deadlift','Pull-up','Barbell row','Lat pulldown','Bicep curl'],'Legs':['Squat','Romanian deadlift','Leg press','Leg curl','Calf raise'],'Full body':['Squat','Bench press','Barbell row','Overhead press','Lunge'],'Upper':['Bench press','Barbell row','Overhead press','Lat pulldown','Bicep curl','Tricep pushdown'],'Lower':['Squat','Romanian deadlift','Leg press','Leg curl','Calf raise']};
function last(n){for(const w of [...S.data].reverse())for(const e of w.ex||[])if(e.name===n)return e.sets.map(s=>({w:s.w,r:s.r}));return null}
function tplV(){return `<div class="card"><b>Quick start</b><div class="chips" style="margin:8px 0 0">${Object.keys(TPL).map(k=>`<button class="chip" onclick="loadT('${k}')">${k}</button>`).join('')}</div><div class="mu" style="margin-top:6px">Loads exercises with your last weights.</div></div>`}
function loadT(k){S.swap=-1;S.draft=TPL[k].map(n=>({name:n,sets:last(n)||[{w:'',r:''},{w:'',r:''},{w:'',r:''}]}));draw()}
function restPick(){return `<label>Rest timer</label><select onchange="S.rest.dur=+this.value">${[30,45,60,90,120,150,180,240,300].map(d=>`<option value="${d}" ${S.rest.dur===d?'selected':''}>${d<120?d+' sec':d/60+' min'}</option>`).join('')}</select>`}
let tick;
function doneSet(i,j){const s=S.draft[i].sets[j];s.d=!s.d;if(s.d)startRest(S.rest.dur);draw()}
function startRest(d){S.rest.end=Date.now()+d*1000;clearInterval(tick);tick=setInterval(rt,250);rt()}
function adj(x){S.rest.end+=x*1000;rt()}
function skip(){S.rest.end=0;rt()}
function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200]);const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch(e){}}
function rt(){const el=$('#rest'),left=Math.ceil((S.rest.end-Date.now())/1000);
 if(!S.rest.end||left<=0){const done=S.rest.end;S.rest.end=0;clearInterval(tick);el.innerHTML='';if(done)beep();return}
 if(!el.firstChild)el.innerHTML='<div class="rb"><span>Rest</span><b></b><button onclick="adj(-15)">−15</button><button onclick="adj(15)">+15</button><button onclick="skip()">Skip</button></div>';
 el.querySelector('b').textContent=tm(left)}
const GR=[['Bench press','Incline dumbbell press','Dumbbell press','Push-up','Chest fly'],['Overhead press','Lateral raise','Arnold press','Front raise'],['Tricep pushdown','Skull crusher','Dips','Overhead extension'],['Deadlift','Barbell row','Pull-up','Lat pulldown','Seated cable row','Dumbbell row'],['Bicep curl','Hammer curl','Preacher curl'],['Squat','Leg press','Lunge','Goblet squat','Bulgarian split squat'],['Romanian deadlift','Leg curl','Hip thrust','Good morning'],['Calf raise','Seated calf raise']];
function swapV(i){const n=S.draft[i].name,g=GR.find(a=>a.includes(n))||EX;
 return `<div style="margin-bottom:10px"><label>Swap with</label><div class="chips">${g.filter(x=>x!==n).map(x=>`<button class="chip" data-n="${x}" onclick="doSwap(${i},this.dataset.n)">${x}</button>`).join('')}</div><div class="row" style="margin:0"><input id="swn" list="exl" placeholder="Or type any exercise"><button class="btn g" style="flex:0 0 auto;width:auto" onclick="doSwap(${i},$('#swn').value)">Swap</button></div></div>`}
function doSwap(i,n){n=(n||'').trim();if(!n)return;const c=S.draft[i].sets.length;S.draft[i]={name:n,sets:last(n)||Array.from({length:c},()=>({w:'',r:''}))};S.swap=-1;draw()}
Object.assign(TPL,{'Full body A':['Squat','Bench press','Barbell row'],'Full body B':['Squat','Overhead press','Deadlift'],'Chest & back':['Bench press','Incline dumbbell press','Pull-up','Barbell row','Chest fly'],'Arms & shoulders':['Overhead press','Lateral raise','Bicep curl','Hammer curl','Tricep pushdown']});
const PG={'Splits':['Push','Pull','Legs','Upper','Lower','Chest & back','Arms & shoulders'],'Full body':['Full body','Full body A','Full body B']};
function tplV2(){return `<label>Preset workout</label><select onchange="loadP(this.value)"><option value="">Choose a preset…</option>${Object.entries(PG).map(([g,a])=>`<optgroup label="${g}">${a.map(k=>`<option>${esc(k)}</option>`).join('')}</optgroup>`).join('')}</select>`}
function loadP(k){if(!k)return;loadT(k)}
function again(id){const w=S.data.find(x=>x.id===id);if(!w)return;
 S.draft=w.ex.map(e=>({name:e.name,sets:e.sets.map(s=>({w:s.w,r:s.r}))}));S.swap=-1;S.edit=null;S.date=ymd(Date.now());S.type='Strength';tab('Log')}
const fw=v=>+(S.wu==='lb'?v*2.20462:v).toFixed(1);
const dw=v=>v===''||v==null?'':fw(v);
const tk=v=>v===''||v==null?'':(S.wu==='lb'?v/2.20462:+v);
const sd=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function ymd(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const dts=()=>new Date((S.date||ymd(Date.now()))+'T12:00:00').getTime();
function tw(){S.wu=S.wu==='kg'?'lb':'kg';save();draw()}
function put(w){const id=S.edit?S.edit.id:Date.now();w.id=id;w.ts=dts();const i=S.data.findIndex(x=>x.id===id);if(i>=0)S.data[i]=w;else S.data.push(w);S.edit=null;S.date=ymd(Date.now());save()}
function edit(id){const w=S.data.find(x=>x.id===id);if(!w)return;
 S.edit={id};S.date=ymd(w.ts);S.type=w.type;S.swap=-1;
 if(w.type==='Strength')S.draft=w.ex.map(e=>({name:e.name,sets:e.sets.map(s=>({w:s.w,r:s.r}))}));
 else{const d=S.unit==='km'?w.km:w.km/K,s=w.sec||0;S.cd={d:d?+d.toFixed(2):'',h:Math.floor(s/3600)||'',m:Math.floor(s%3600/60)||'',s:s%60||'',nt:w.note||''}}
 tab('Log')}
function cancelEdit(){S.edit=null;S.draft=[];S.cd={};S.date=ymd(Date.now());draw()}
function addBw(){const v=parseFloat($('#bwi').value);if(!(v>0))return;S.bw.push({ts:Date.now(),kg:tk(v)});save();draw()}
function delBw(ts){S.bw=S.bw.filter(a=>a.ts!==ts);save();draw()}
function cm(d){const n=new Date(S.cal.y,S.cal.m+d,1);S.cal={y:n.getFullYear(),m:n.getMonth()};draw()}
function calV(){const y=S.cal.y,m=S.cal.m,f=new Date(y,m,1),off=(f.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),by={},pre=y+'-'+String(m+1).padStart(2,'0');
 S.data.forEach(w=>{const k=ymd(w.ts);(by[k]=by[k]||[]).push(w)});
 let c='';for(let i=0;i<off;i++)c+='<div></div>';
 for(let d=1;d<=n;d++){const k=pre+'-'+String(d).padStart(2,'0');c+=`<button class="day ${by[k]?'has':''} ${S.cday===k?'sel':''}" onclick="S.cday='${k}';draw()">${d}${by[k]?'<i></i>':''}</button>`}
 const cnt=Object.keys(by).filter(k=>k.startsWith(pre)).reduce((a,k)=>a+by[k].length,0),sel=by[S.cday];
 return `<div class="card"><div class="row" style="align-items:center"><button class="x" onclick="cm(-1)">‹</button><b style="text-align:center">${f.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="x" onclick="cm(1)">›</button></div><div class="mu s" style="margin-bottom:8px">${cnt} workout${cnt===1?'':'s'} this month</div><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<span class="mu">${x}</span>`).join('')}${c}</div></div>`+
 `<div class="mu" style="margin:0 0 6px">${fd(S.cday+'T12:00:00')}</div>`+(sel?sel.map(w=>`<div class="card"><b>${w.type}</b>${summ(w)}</div>`).join(''):'<p class="mu s">No workouts on this day.</p>')}
function lineC(p,u){if(p.length<2)return '<div class="mu">Log at least 2 entries to see a chart.</div>';
 const W=320,H=130,m=30,xs=p.map(a=>a.x),ys=p.map(a=>a.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),dy=(y1-y0)||1,dx=(x1-x0)||1,
 X=x=>(m+(x-x0)/dx*(W-m-8)).toFixed(1),Y=y=>(H-20-(y-y0)/dy*(H-38)).toFixed(1);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline class="cl" points="${p.map(a=>X(a.x)+','+Y(a.y)).join(' ')}"/>${p.map(a=>`<circle class="ca" cx="${X(a.x)}" cy="${Y(a.y)}" r="3"/>`).join('')}<text class="cm" x="2" y="${+Y(y1)+4}">${+y1.toFixed(1)}</text><text class="cm" x="2" y="${+Y(y0)+4}">${+y0.toFixed(1)}</text><text class="cm" x="${m}" y="${H-4}">${sd(x0)}</text><text class="cm" x="${W-8}" y="${H-4}" text-anchor="end">${sd(x1)}</text></svg><div class="mu">${u}</div>`}
function barC(v,l){const mx=Math.max(...v,1);return `<svg viewBox="0 0 320 110" width="100%">${v.map((a,i)=>`<rect class="ca" x="${10+i*38}" y="${90-a/mx*78}" width="28" height="${a/mx*78}" rx="4"/><text class="cm" x="${24+i*38}" y="104" text-anchor="middle">${l[i]}</text>`).join('')}</svg>`}
function statV(){
 const wk=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()},m0=wk(Date.now()),rows=[],bars=[],lab=[];
 for(let i=0;i<8;i++){const st=m0-i*6048e5,ws=S.data.filter(w=>w.ts>=st&&w.ts<st+6048e5),km=ws.reduce((a,w)=>a+(w.km||0),0),v=ws.reduce((a,w)=>a+vol(w),0);
  bars.unshift(S.unit==='km'?km:km/K);lab.unshift(sd(st));
  if(i<4)rows.push(`<tr><td>${i?sd(st):'This week'}</td><td>${ws.length}</td><td>${dist(km)}</td><td>${Math.round(fw(v)).toLocaleString()}</td></tr>`)}
 const pr={},lg={};S.data.forEach(w=>{if(w.km&&(!lg[w.type]||w.km>lg[w.type]))lg[w.type]=w.km;(w.ex||[]).forEach(e=>e.sets.forEach(s=>{if(!pr[e.name]||s.w>pr[e.name].w)pr[e.name]={w:s.w,r:s.r}}))});
 const prs=Object.entries(pr).sort((a,b)=>b[1].w-a[1].w).slice(0,6).map(([n,p])=>`<tr><td>${esc(n)}</td><td>${fw(p.w)} ${S.wu} × ${p.r}</td></tr>`).join('')+Object.entries(lg).map(([t,k])=>`<tr><td>Longest ${t.toLowerCase()}</td><td>${dist(k)}</td></tr>`).join('');
 const names=Object.keys(pr).sort(),cx=names.includes(S.cx)?S.cx:names[0],
 pts=cx?S.data.filter(w=>(w.ex||[]).some(e=>e.name===cx)).sort((a,b)=>a.ts-b.ts).map(w=>({x:w.ts,y:fw(Math.max(...w.ex.filter(e=>e.name===cx).flatMap(e=>e.sets.map(s=>s.w*(1+s.r/30)))))})):[],
 bw=[...S.bw].sort((a,b)=>a.ts-b.ts),lb=bw[bw.length-1];
 return `<div class="grid"><div class="card s"><div class="big">${S.data.length}</div><div class="mu">Workouts</div></div><div class="card s"><div class="big">${dist(S.data.reduce((a,w)=>a+(w.km||0),0))}</div><div class="mu">Total distance</div></div></div>
<div class="card tb"><b>Last 4 weeks</b><table><tr><th></th><th>Workouts</th><th>Distance</th><th>Volume ${S.wu}</th></tr>${rows.join('')}</table></div>
<div class="card"><b>Body weight</b><div class="row" style="margin:8px 0"><input id="bwi" type="number" inputmode="decimal" placeholder="${S.wu}"><button class="btn" style="flex:0 0 auto;width:auto;padding:10px 16px" onclick="addBw()">Log today</button></div>${lineC(bw.map(a=>({x:a.ts,y:fw(a.kg)})),'Body weight ('+S.wu+')')}${lb?`<div class="mu">Latest: ${fw(lb.kg)} ${S.wu} on ${sd(lb.ts)} <button class="x" onclick="delBw(${lb.ts})">Remove</button></div>`:''}</div>
<div class="card"><b>Strength progress</b>${cx?`<select style="margin:8px 0" onchange="S.cx=this.value;draw()">${names.map(n=>`<option ${n===cx?'selected':''}>${esc(n)}</option>`).join('')}</select>${lineC(pts,'Estimated 1RM ('+S.wu+')')}`:'<div class="mu">Log a strength workout to see progress.</div>'}</div>
<div class="card"><b>Weekly distance (${S.unit})</b>${barC(bars,lab)}</div>
<div class="card tb"><b>Personal bests</b><table>${prs||'<tr><td class="mu">None yet</td></tr>'}</table></div>`}
function addEx(){const n=$('#exn').value.trim();if(!n)return;S.draft.push({name:n,sets:[{w:'',r:''}]});draw()}
function addSet(i){const l=S.draft[i].sets.slice(-1)[0];S.draft[i].sets.push({w:l.w,r:l.r});draw()}
function saveStr(){
 const ex=S.draft.map(e=>({name:e.name,sets:e.sets.filter(s=>+s.r>0).map(s=>({w:+s.w||0,r:+s.r}))})).filter(e=>e.sets.length);
 if(!ex.length){toast('Add at least one set with reps.');return}
 put({type:'Strength',ex});S.draft=[];S.swap=-1;tab('History')
}
function saveCar(){
 const d=parseFloat($('#d').value)||0,sec=(+$('#hh').value||0)*3600+(+$('#mm').value||0)*60+(+$('#ss').value||0);
 if(!d&&!sec){toast('Enter a distance or duration.');return}
 put({type:S.type,km:S.unit==='km'?d:d*K,sec,note:$('#nt').value.trim()});S.cd={};tab('History')
}
function del(id){if(S.cfm!==id){S.cfm=id;draw();setTimeout(()=>{if(S.cfm===id){S.cfm=null;draw()}},3000);return}S.cfm=null;S.data=S.data.filter(w=>w.id!==id);save();draw()}
function toast(t){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function summ(w){
 if(w.type==='Strength')return w.ex.map(e=>`<div class="mu">${esc(e.name)}: ${e.sets.map(s=>fw(s.w)+'×'+s.r).join(', ')}</div>`).join('')+`<div class="mu">Volume ${Math.round(fw(vol(w))).toLocaleString()} ${S.wu}</div>`;
 let a=[];if(w.km)a.push(dist(w.km));if(w.sec)a.push(tm(w.sec));
 if(w.km&&w.sec){const p=w.sec/(S.unit==='km'?w.km:w.km/K);const sp=(S.unit==='km'?w.km:w.km/K)/(w.sec/3600);a.push(['Cycle','Row'].includes(w.type)&&w.type==='Cycle'?sp.toFixed(1)+' '+S.unit+'/h':tm(p)+' /'+S.unit)}
 return `<div class="big">${a.join(' · ')}</div>`+(w.note?`<div class="mu">${esc(w.note)}</div>`:'');
}
function histV(){
 if(!S.data.length)return '<p class="mu s">No workouts yet. Log your first one.</p>';
 return [...S.data].sort((a,b)=>b.ts-a.ts).map(w=>`<div class="card"><div class="row" style="margin:0 0 4px"><div><b>${w.type}</b> <span class="mu">${fd(w.ts)}</span></div>${w.type==='Strength'?`<button class="x" style="color:var(--ac)" onclick="again(${w.id})">Do again</button>`:''}<button class="x" onclick="edit(${w.id})">Edit</button><button class="x" onclick="del(${w.id})">${S.cfm===w.id?'Sure?':'Delete'}</button></div>${summ(w)}</div>`).join('');
}

try{S.wu=localStorage.getItem('pl_wu')||'kg';S.bw=JSON.parse(localStorage.getItem('pl_bw')||'[]')}catch(e){}
S.date=ymd(Date.now());S.cday=S.date;{const n=new Date();S.cal={y:n.getFullYear(),m:n.getMonth()}}
draw();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
